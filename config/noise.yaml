# Noise model (Doc 29 5th Ed.) on observed OEJN departures — run configuration
release_id: "noise-doc29e5-oejn-2026-10-01-v1"
study_day_utc: "2026-10-01"
local_utc_offset_h: 3            # Asia/Riyadh, no DST

inputs:                          # relative to the repository root; each can be overridden by an env var
  a2_dir: "data/inputs/a2"                         # NOISE_A2_DIR: a2_noise_departures.parquet, a2_noise_flights.csv, a2_noise_manifest.json
  metar_csv: "data/inputs/ext_metar_oejn.csv"      # NOISE_METAR_CSV (scripts/colab_external_data.py)
  aircraft_identity_csv: "data/inputs/a3_aircraft_identity.csv"   # NOISE_A3_CSV (optional; without it the Doc 29 unknown-engine rule applies)
  aircraft_identity_fill_csv: "data/inputs/a3_aircraft_identity_fill.csv"   # NOISE_A3_FILL_CSV (optional; scripts/colab_identity_fill.py, used only where the primary file has no type)
  runways_csv: "data/external/a1_external_airport_runways.csv"    # A1 handoff (AIP AIRAC AMDT 10/26)
  a5_processed: "data/a5/processed"
  a6_receptors: "data/a6/processed/a6_receptors.parquet"

aerodrome:
  icao: OEJN
  arp_lat: 21.6811111111
  arp_lon: 39.1561111111

flights:
  runway_status: ["accepted_departure_candidate"]   # A2 statuses modelled; all others are reported, not modelled
  runways: ["34C", "34L", "34R", "16C", "16L", "16R"]
  min_airborne_points: 10

flight_path:                      # src/noise/flightpath.py PathPolicy
  height_source: "auto"           # auto | geometric | baro (site.py)
  min_seg_ft_low: 500.0
  min_seg_ft_mid: 1000.0
  min_seg_ft_high: 3000.0
  max_speed_step_kt: 10.0
  max_heading_step_deg: 5.0
  liftoff_fit_min_z_ft: 100.0
  liftoff_fit_max_z_ft: 1000.0
  liftoff_window_s: 120.0
  liftoff_min_ft: 1500.0
  height_smoothing_points: 5
  bank_smoothing_s: 20.0
  max_bank_deg: 35.0
  max_liftoff_to_first_obs_ft: 16404.0   # 5 km; otherwise the departure is not observed near the runway -> PATH_FAILED
  max_first_obs_height_ft: 3000.0

power:
  takeoff_rating: "MaxTakeoff"    # full take-off thrust: Doc 29 Vol 2 §3.5 - realistic where air temperatures are high
  climb_rating: "MaxClimb"
  cutback: "anp_default_profile"  # height of the last take-off-rating step of the ANP DEFAULT profile, stage 1
  cutback_fallback_ft: 1000.0     # used only when the ANP aircraft has no DEFAULT profile (flagged)

weather:
  max_age_min: 90
  fallback: {t_c: 15.0, rh_pct: 70.0, qnh_hpa: 1013.25}   # used only when no METAR within max_age_min (flagged MET_FALLBACK)
  atmospheric_adjustment: true    # Doc 29 Appendix D increments from the departure spectral class
  impedance_adjustment: true      # Eq. 4-6/4-7 at aerodrome conditions

mapping:
  substitution_method: "A"        # A5 policy (Method A: delta dB on the proxy NPD)
  pending_proxy_policy: "proxy_zero_delta"   # B78X/A339/B39M analyst proxies without certified levels: model with delta 0, flagged
  unresolved_policy: "exclude"    # types without any mapping are excluded and reported

grid:
  spacing_m: 250.0
  half_width_m: 40000.0           # square around the ARP (UTM 37N)
  prune_m: null                   # null = every segment at every receptor (exact Doc 29 sum). A distance (m) skips segments
                                  # farther than that horizontally; tested: at 20 km dropped single-event SEL reached 58 dB (B77W)

metrics:
  periods_local: {day: [7, 19], evening: [19, 23], night: [23, 7]}   # EU END Annex I
  penalties_db: {day: 0.0, evening: 5.0, night: 10.0}
  number_above_db: [60, 65, 70]
  per_flight_lamax_db: [60, 65, 70]
  per_flight_sel_db: [80, 90]
  lden_bands_db: [45, 50, 55, 60, 65, 70, 75]
  lnight_bands_db: [40, 45, 50, 55, 60, 65]

run:
  workers: 2
  save_flight_grids: false
