policies:
  anp_release: "2.3"            # baseline. A verified EASA dataset is a separate release, never mixed row-by-row.
  npd:
    distance_floor_m: 30.0      # Doc 29 Vol 2 p.29: "recommended" lower limit d = max(d, 30 m)
    power_floor_lb_per_engine: 1.0   # Doc 29 Vol 2 p.28: negative/low CNT reset to 1 lb per engine
    power_extrapolation_warn_db: 5.0 # Doc 29 Vol 2 p.28: caution if extrapolation adds > 5 dB beyond envelope
  mapping:
    substitution_method: "A"    # A = dB adjustment of proxy NPD (all metrics). B = movement factor N (energy metrics only).
    unknown_mtow_rule: "max"    # Doc 29 Vol 1 p.45: assume the highest-MTOW variant
    unknown_engine_rule: "conservative"  # highest certified departure level at max MTOW (Doc 29 Vol 1 p.45)
    mtow_match_tolerance_kg: 0.5
    engine_family_min_chars: 5  # minimum length for prefix (engine-family) matching

tolerances:
  vol3_b2_baseline_sel_max_abs_db: 0.01   # ERROR above this (Vol 3: reproduce to the precision presented; dRMS aim 0.01 dB)
  vol3_b2_baseline_sel_target_db: 0.001   # WARNING above this
  unit_conversion_rel: 1.0e-12
